<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Football Agency Sierra Leone</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link rel="stylesheet" href="contact.css"> 
</head>
<body>
    <div class="container">
        <header>
        <div class="container">
            <div class="logo">
                <img src="FOOTBALL AGENCY SL.png" alt="" width="100" height="60">
            </div>
            <div class="header-name">
                <h1>Football Agency Sierra Leone</h1>
            </div>
        </div>
    </header>
        <h2 class="page-title">CONTACT</h2>


        <div class="contact-row">
            
            <div class="contact-details">
                <div class="contact-item">
                    <span class="icon">📍</span>
                    <div>
                        <h3>ADDRESS</h3>
                        <p>76 Smart Lane</p>
                    </div>
                </div>
                <div class="contact-item">
                    <span class="icon">✉️</span>
                    <div>
                        <h3>EMAIL</h3>
                        <p>osmansheriff@gmail.com</p>
                    </div>
                </div>
                <div class="contact-item">
                    <span class="icon">☎</span>
                    <div>
                        <h3>PHONE</h3>
                        <p>+23230379022</p>
                    </div>
                </div>
            </div>

            <div class="contact-form">
                <h3>MESSAGE</h3>
                <form>
                    <input type="text" placeholder="NAME" required>
                    <input type="email" placeholder="EMAIL" required>
                    <textarea rows="6" placeholder="MESSAGE" required></textarea>
                    <button type="submit">SEND</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer-nav">
        <a href="index.html" class="nav-btn">HOME</a>
        <a href="players.html" class="nav-btn">PLAYERS</a>
        <a href="matches.html" class="nav-btn">MATCHES</a>
        <a href="about.html" class="nav-btn">ABOUT</a>
        <a href="contact.html" class="nav-btn active">CONTACT</a>
    </footer>
</body>
</html>
